name: CI

# Every pull request and push to unstable/dev/main, and once a week: the tests
# inside Debian containers - trixie (stable, must pass) and forky (testing,
# the next stable: allowed to fail, an early warning of what the next Debian
# release will change; the weekly run catches it moving between pushes).
on:
  pull_request:
  push:
    branches: [unstable, dev, main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (debian ${{ matrix.debian }})
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.debian }}
    continue-on-error: ${{ matrix.debian == 'forky' }}
    strategy:
      fail-fast: false
      matrix:
        debian: [trixie, forky]
    steps:
      # git first, so actions/checkout makes a real git checkout
      - name: Debian packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates \
            gcc gfortran make perl libperl-dev swig hdf5-tools pdftk-java \
            gnuplot-nox grace ghostscript zip unzip ffmpeg poppler-utils procps rakudo raku-json-fast

      - uses: actions/checkout@v4
        with:
          path: OneFit-Engine

      # Siblings of the checkout, where ./INSTALL puts them (OFE-PATH/../C,
      # OFE-PATH/../minuit; the tests find pdf2mp4 in OFE-PATH/../bin).
      - name: The engine's sources
        run: |
          git clone --depth 1 https://github.com/fitteia/onefite-c-code.git C
          git clone --depth 1 https://github.com/fitteia/minuit.git minuit

      - name: Build the engine
        working-directory: OneFit-Engine
        run: |
          mkdir -p "$GITHUB_WORKSPACE/bin"
          perl ../C/tools/engine.pl install --c-root ../C --root "$PWD" \
            --minuit-dir ../minuit --minuit-max-params 1000 \
            --bindir "$GITHUB_WORKSPACE/bin" \
            --perlcore "$(perl -MConfig -e 'print "$Config{archlib}/CORE"')" \
            --no-default-extensions --no-fetch

      - name: Tests
        working-directory: OneFit-Engine
        run: PATH="$GITHUB_WORKSPACE/bin:$PATH" prove -e 'raku -Ilib' --ext .rakutest t/
